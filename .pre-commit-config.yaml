repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - numpy>=1.26.0
        args: [--ignore-missing-imports]
        files: ^src/

  # Prettier: format Svelte, TS, JS, JSON in frontend/
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/
        types_or: [svelte, ts, javascript, json]
        additional_dependencies:
          - prettier@^3.3.0
          - prettier-plugin-svelte@^3.2.0

  # #51 — tokens.vendored.json must stay in sync with the design-system SSOT
  # (06_Aurora_Design_system/01_Tokens/tokens.json). Runs every commit; skips
  # gracefully when the external SSOT sibling dir is absent (e.g. CI runners).
  - repo: local
    hooks:
      - id: check-tokens-vendored
        name: check tokens.vendored.json in sync with SSOT (#51)
        entry: sh -c 'cd frontend && node scripts/check-tokens-vendored.mjs'
        language: system
        always_run: true
        pass_filenames: false

  # ESLint: lint frontend Svelte + TS via local node_modules (eslint 9 flat config)
  - repo: local
    hooks:
      - id: eslint-frontend
        name: eslint (frontend)
        entry: sh -c 'cd frontend && npx eslint --max-warnings 0 src/'
        language: system
        files: ^frontend/src/
        types_or: [svelte, ts, javascript]
        pass_filenames: false

  # Cargo fmt: format Rust code (skipped gracefully if cargo not on PATH)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (src-tauri)
        entry: sh -c 'command -v cargo >/dev/null 2>&1 && cargo fmt --manifest-path src-tauri/Cargo.toml -- --check || echo "cargo not found, skipping rust fmt"'
        language: system
        files: ^src-tauri/
        types: [rust]
        pass_filenames: false
