[project]
name = "aurora-launch"
version = "0.1.0-b05"
description = "Aurora Launch — MMM forecasting product for new brand launches via ad-hoc proxy intake"
authors = [
    { name = "Aurora Analytics", email = "ackold@yandex.ru" },
]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rfc8785>=0.1.4",
    "click>=8.1.0",
    "rich>=13.9.0",
]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pyyaml>=6.0.2",
]

# Phase A path-deps are configured locally per developer via uv.sources
# в .uv/sources.local.toml (gitignored). Production install uses git+https
# to aurora-platform-core releases. CI doesn't need Phase A — tests that
# require it auto-skip via PLATFORM_CORE_PATH check.
#
# For local dev with sibling aurora-platform-core checkout, run:
#   uv add --editable ../aurora-platform-core/aurora_studio
#   uv add --editable ../aurora-platform-core/aurora_schema_registry
#   uv add --editable ../aurora-platform-core/aurora_inference

[project.scripts]
aurora-launch-reproduce = "aurora_launch.tools.reproduce:main"
aurora-corpus = "aurora_launch.tools.corpus_cli:main"
aurora-launch-export-ts = "aurora_launch.tools.export_typescript:main"
aurora-launch-schema-diff = "aurora_launch.tools.schema_diff:main"
aurora-launch-migrate-bundle = "aurora_launch.tools.migrate_bundle:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_launch"]
# Include PEP 561 marker для type info distribution
include = ["src/aurora_launch/py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
