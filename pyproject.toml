[project]
name = "aurora-launch"
version = "0.1.5"
description = "Aurora Launch — MMM forecasting product for new brand launches via ad-hoc proxy intake"
authors = [
    { name = "Aurora Analytics", email = "ackold@yandex.ru" },
]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rfc8785>=0.1.4",
    "click>=8.1.0",
    "rich>=13.9.0",
    # POST_PILOT_BACKLOG openpyxl close (audit-mini-f1, 2026-05-10):
    # DSM V2024 XLSX adapter requires openpyxl. Previously lazy import + graceful
    # ImportError, but pilot DSM data on Materia Medica side = .xlsx (not .csv).
    # Without this dep installation user gets ImportError на первом import.
    "openpyxl>=3.1.5",
    # Blob serialization: msgpack replaces pickle (security hardening 2026-05-14).
    # cryptography used for Ed25519 blob signing.
    "msgpack>=1.0.7",
    "cryptography>=42.0",
    # Math engines (Phase π.1 — ported from Aurora Econometrica).
    # JAX / NumPyro intentionally NOT listed here — optional Tier-1 MCMC backend;
    # user can install separately for 5-15× speed-up. Without JAX, Tier-2 PyTensor
    # NUTS is used automatically.
    "pymc>=5.0",
    "arviz>=0.18",
    "pytensor>=2.18",
    # Phase Scale S-10: memory profile + policy (process RSS + virtual mem).
    # Cross-platform; required for IPC get_memory_report. Handler degrades
    # gracefully when missing (severity='ok', measured=False).
    "psutil>=5.9",
    # Sprint 0 (2026-05-19): Aurora platform-core shared library — engines + observability.
    # Per-package deps (NOT umbrella aurora-platform-core which is monorepo name),
    # MN ack 2026-05-19 в aurora-meta 5cec585.
    # Local dev: sources resolved through [tool.uv.sources] к sibling D:/Docs/Aurora_Ai/aurora-platform-core/.
    # Prod distribution: replace sources с git+https tag pin (Sprint 0 audit clear gate).
    "aurora-engines>=0.1.0,<0.2",
    "aurora-observability>=0.1.0,<0.2",
]

# Editable local checkout для Phase A platform-core packages (Sprint 0 dev workflow).
# CI: clone aurora-platform-core as sibling before uv sync (separate CI fix commit).
[tool.uv.sources]
aurora-engines = { path = "../aurora-platform-core/aurora_engines", editable = true }
aurora-observability = { path = "../aurora-platform-core/aurora_observability", editable = true }

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pyyaml>=6.0.2",
    # PyInstaller для sidecar packaging (CI per-OS builds + local test).
    # Py3.12 поддерживается с PyInstaller 6.0+.
    "pyinstaller>=6.0",
    # pre-commit: git hook manager. Install hooks once with: pre-commit install
    "pre-commit>=3.8.0",
]

# Phase A path-deps (aurora_studio / aurora_schema_registry / aurora_inference) deferred —
# не используются в Launch коде на 2026-05-19. Sprint 0 wires только aurora-engines +
# aurora-observability через [tool.uv.sources] выше.

[project.scripts]
aurora-launch-reproduce = "aurora_launch.tools.reproduce:main"
aurora-corpus = "aurora_launch.tools.corpus_cli:main"
aurora-launch-export-ts = "aurora_launch.tools.export_typescript:main"
aurora-launch-schema-diff = "aurora_launch.tools.schema_diff:main"
aurora-launch-migrate-bundle = "aurora_launch.tools.migrate_bundle:main"
aurora-launch-validate-license = "aurora_launch.tools.validate_license_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_launch"]
# Include PEP 561 marker для type info distribution
include = ["src/aurora_launch/py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
# QW6 audit hardening: treat warnings as errors by default so new
# DeprecationWarning surfaces immediately. Known tech-debt warnings
# explicitly allowlisted (ProxyBundle flat-field shim from S-12,
# RuntimeWarnings from numpy hill_saturation extreme alpha, etc.).
# Migration к structured API planned для v0.2.0 sweep.
filterwarnings = [
    "error",
    # Phase 1 hard cut: S-12 ProxyBundle backward-compat shim removed.
    # make_proxy_bundle() factory replaces legacy flat-args constructor.
    # 99 warnings/run eliminated.
    # numpy hill_saturation extreme alpha — guarded fallback path
    "ignore::RuntimeWarning:aurora_launch.engines.pure_transfer_engine",
    # Test-only deprecation от dependency stack
    "ignore::PendingDeprecationWarning",
    # 3rd-party libraries — out of our control
    "ignore::DeprecationWarning:numpy.*",
    "ignore::DeprecationWarning:pandas.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:openpyxl.*",
    # ArviZ undergoing major refactor (2026); FutureWarnings on import.
    # Migration guide: https://python.arviz.org/en/latest/user_guide/migration_guide.html
    # Sprint Buffer item: update ArviZ usage to new API после release.
    "ignore::FutureWarning:arviz.*",
    # File handle leak от XLSX sample bundle reader (openpyxl streaming).
    # Out of our control — closing handles fixed at adapter level.
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # Resource warnings — typically openpyxl или Windows file handle quirks
    "ignore::ResourceWarning",
    # zipfile.UserWarning("Duplicate name: ...") emitted before our duplicate-
    # entry rejection — our code raises после warning. Tests verify rejection;
    # warning is noise.
    "ignore:Duplicate name:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.coverage.run]
source = ["src/aurora_launch"]
omit = ["tests/*", "src/aurora_launch/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "@abstractmethod",
]
