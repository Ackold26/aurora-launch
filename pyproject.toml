[project]
name = "aurora-launch"
version = "0.1.0-b05"
description = "Aurora Launch — MMM forecasting product for new brand launches via ad-hoc proxy intake"
authors = [
    { name = "Aurora Analytics", email = "ackold@yandex.ru" },
]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "rfc8785>=0.1.4",
    "click>=8.1.0",
    "rich>=13.9.0",
]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.115.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv.sources]
aurora-studio = { path = "../aurora-platform-core/aurora_studio", editable = true }
aurora-schema-registry = { path = "../aurora-platform-core/aurora_schema_registry", editable = true }
aurora-inference = { path = "../aurora-platform-core/aurora_inference", editable = true }

[project.scripts]
aurora-launch-reproduce = "aurora_launch.tools.reproduce:main"
aurora-corpus = "aurora_launch.tools.corpus_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora_launch"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RET", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
