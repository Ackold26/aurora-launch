# Aurora Launch — test pipeline (Python + Rust + Frontend + Cloud).
# Runs on PR + push к main. Required green for merge.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python pytest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short

  rust:
    name: Rust cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cargo build (no run)
        working-directory: src-tauri
        env:
          AURORA_BUILD_PROFILE: dev
        run: cargo check --all-targets
      - name: Cargo test (lib)
        working-directory: src-tauri
        env:
          AURORA_BUILD_PROFILE: dev
        run: cargo test --lib

  frontend:
    name: Frontend (vitest + svelte-check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run gen:tokens
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test

  cloud:
    name: Aurora Cloud (Edge Functions)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: aurora-cloud/package-lock.json
      - working-directory: aurora-cloud
        run: npm ci || npm install
      - working-directory: aurora-cloud
        run: npm test
