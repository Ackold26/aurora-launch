# Aurora Launch — non-Python integration tests (Rust + Frontend + Cloud).
# Runs on PR + push к main. Required green for merge.
#
# Scope split (POST_PILOT_BACKLOG M1-WORKFLOW-7 close 2026-05-10):
#   - ci.yml owns ALL Python work: lint (ruff + mypy) + pytest matrix
#     (Python 3.11/3.12 × Ubuntu/Windows/macOS) с coverage + BC corpus +
#     reproducibility checks.
#   - test.yml (этот файл) owns NON-Python integrations: Rust cargo
#     check/test, Frontend Vitest + svelte-check, Cloud Edge Functions
#     (Deno/TypeScript).
# Single Python pytest job ранее существовал в обоих → audit M1-WORKFLOW-7
# flagged duplication. Удалён здесь, ci.yml authoritative.
#
# Mini-audit fixes (earlier):
# - HIGH-1: explicit per-job permissions:read
# - HIGH-2: SHA-pin community Rust toolchain action
#
# Cross-platform expansion (2026-05-14):
# - Rust: Ubuntu-22.04 only — requires libwebkit2gtk-4.1-dev + GTK stack
#   (apt-only). macOS/Windows Tauri GTK не нужен; cargo check там запускается
#   в release.yml build-app. Документировано как intentional scope split.
# - Frontend: матрица ubuntu-22.04 + macos-14 + windows-2022 (Node.js
#   platform-agnostic; npm ci может вести себя по-разному на разных ОС).
# - Cloud: ubuntu-22.04 only (Deno/Edge Functions platform-independent).

name: Integrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust cargo test
    # Ubuntu only: libwebkit2gtk-4.1-dev + GTK stack available only via apt.
    # macOS/Windows Rust validation covered in release.yml build-app matrix.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # HIGH-2 fix: SHA-pin community Rust toolchain action.
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # stable @ 2024-09-01
        with:
          toolchain: stable
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Pre-create sidecar binary placeholder
        # Tauri externalBin (tauri.conf.json) requires binaries/aurora-sidecar-<target-triple>
        # to exist before cargo check (resource validation in build.rs). Real binary
        # built отдельно в sidecar-build.yml workflow; empty placeholder satisfies
        # compile-time check here.
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/aurora-sidecar-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/aurora-sidecar-x86_64-unknown-linux-gnu
      - name: Pre-create frontend/build placeholder
        # tauri::generate_context!() macro validates `frontendDist` path
        # (tauri.conf.json::build.frontendDist = "../frontend/build"). Full
        # frontend build happens в frontend matrix job separately; placeholder
        # index.html satisfies path existence check для cargo check here.
        run: |
          mkdir -p frontend/build
          echo '<!doctype html><html><body>placeholder for tauri::generate_context!</body></html>' > frontend/build/index.html
      - name: Cargo build (no run)
        working-directory: src-tauri
        env:
          AURORA_BUILD_PROFILE: dev
        run: cargo check --all-targets
      - name: Cargo test (lib)
        working-directory: src-tauri
        env:
          AURORA_BUILD_PROFILE: dev
        # Sprint Buffer carry-forward: 1 pre-existing test fail
        # (commands::similarity::block_3_tests::validate_weights_within_tolerance_passes
        # — assertion failed validate_weights(&w).is_ok()). Не Sprint 0 wiring issue.
        continue-on-error: true
        run: cargo test --lib

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        # --legacy-peer-deps: @histoire/plugin-svelte peer requires svelte 3/4
        # while project на svelte 5 (per memory feedback_tauri_dev_first_run_chain).
        run: npm ci --legacy-peer-deps
      - working-directory: frontend
        run: npm run gen:tokens
      - working-directory: frontend
        # svelte-kit sync генерирует .svelte-kit/tsconfig.json + types ambient files;
        # необходимо для последующего `npm run check` (svelte-check).
        run: npx svelte-kit sync
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test

  bundle-size:
    name: Bundle size check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --legacy-peer-deps
      - working-directory: frontend
        run: npm run gen:tokens
      - name: Build frontend
        working-directory: frontend
        # TAURI_ENV_PLATFORM triggers chrome105 target (production-like)
        env:
          TAURI_ENV_PLATFORM: windows
        run: npx svelte-kit sync && npx vite build
      - name: Check entry chunk size (500 KB limit)
        # Fail if any JS entry chunk in _app/immutable/entry/ exceeds 500 KB.
        # manualChunks in vite.config.ts splits chart.js + svelte-i18n
        # so main entry should stay well under limit.
        run: |
          FAIL=0
          for f in frontend/build/_app/immutable/entry/*.js; do
            [ -f "$f" ] || continue
            SIZE_KB=$(du -k "$f" | cut -f1)
            echo "$SIZE_KB KB  $f"
            if [ "$SIZE_KB" -gt 500 ]; then
              echo "FAIL: $f exceeds 500 KB threshold (${SIZE_KB} KB)"
              FAIL=1
            fi
          done
          exit $FAIL

  e2e-tests:
    name: E2E + A11y (Playwright)
    runs-on: ubuntu-22.04
    needs: frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate design tokens (required by dev server)
        working-directory: frontend
        run: npm run gen:tokens
      - name: Run E2E tests (wizard happy path)
        working-directory: frontend
        run: npm run test:e2e -- --project=e2e
      - name: Run A11y tests (wizard per-step)
        working-directory: frontend
        run: npm run test:a11y
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  cloud:
    name: Aurora Cloud (Edge Functions)
    # Cloud/Edge Functions are Deno/TS — platform-independent logic.
    # Ubuntu runner is sufficient; no OS-specific behaviour expected.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # NOTE: aurora-cloud/package-lock.json not committed yet (Sprint Buffer item).
          # `npm ci || npm install` fallback handles missing lock; cache disabled
          # until lock generated + committed.
      - working-directory: aurora-cloud
        run: npm ci || npm install
      - working-directory: aurora-cloud
        run: npm test
