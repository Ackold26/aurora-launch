# PyInstaller cross-platform sidecar build (Block 4 deferred B4-LOW-1).
# Triggered on push к main, on tags, и manually via workflow_dispatch.
# Produces aurora-sidecar binary suffixed с Tauri target triple.
#
# Mini-audit fixes:
# - HIGH-1: permissions explicitly contents:read (no token write needed)
# - HIGH-4: install runtime deps only (NO [dev]) into PyInstaller env

name: Sidecar build (PyInstaller)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/aurora_launch/sidecar/**'
      - 'packaging/aurora-sidecar.spec'
      - 'pyproject.toml'
      - '.github/workflows/sidecar-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: '3.12'
            arch: x86_64
            binary_name: aurora-sidecar
          - os: macos-13
            target: x86_64-apple-darwin
            python: '3.12'
            arch: x86_64
            binary_name: aurora-sidecar
          - os: macos-14
            target: aarch64-apple-darwin
            python: '3.12'
            arch: aarch64
            binary_name: aurora-sidecar
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: '3.12'
            arch: x86_64
            binary_name: aurora-sidecar.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install runtime deps + tests + pyinstaller (separated envs)
        # HIGH-4 fix: split test env (с dev extras) from build env (runtime
        # only). Dev env runs pytest; build env stays lean for binary size.
        run: |
          python -m pip install --upgrade pip
          # Test env (with dev extras for pytest etc.)
          pip install -e ".[dev]"

      - name: Run sidecar tests (INV-08 actual pytest)
        run: python -m pytest tests/test_sidecar_auth.py tests/test_sidecar_protocol_server.py -v

      - name: Reinstall runtime-only for build (drop dev tooling)
        # HIGH-4 fix: PyInstaller bundles whatever is import-reachable. Strip
        # dev tools (pytest/hypothesis/ruff/mypy) before bundling.
        run: |
          pip uninstall -y pytest pytest-cov hypothesis ruff mypy || true
          pip install pyinstaller

      - name: Build sidecar binary
        run: pyinstaller packaging/aurora-sidecar.spec --distpath dist --clean

      - name: Smoke test built binary (INV-02 runtime smoke)
        shell: bash
        env:
          AURORA_SIDECAR_AUTH_TOKEN: '${{ secrets.SIDECAR_SMOKE_TOKEN }}'
        run: |
          set -euo pipefail
          # Generate a smoke token if secret missing (CI без secret access).
          if [ -z "${AURORA_SIDECAR_AUTH_TOKEN:-}" ]; then
            AURORA_SIDECAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
            export AURORA_SIDECAR_AUTH_TOKEN
          fi
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            BINARY="dist/${{ matrix.binary_name }}"
          else
            BINARY="./dist/${{ matrix.binary_name }}"
          fi
          REQUEST="{\"id\":1,\"method\":\"ping\",\"params\":{},\"auth\":\"$AURORA_SIDECAR_AUTH_TOKEN\"}"
          # POST_PILOT_BACKLOG M1-WORKFLOW-9 close (2026-05-10): replaced
          # opaque `|| true` (which swallowed both grep no-match AND pipeline
          # errors) с explicit return-code dispatch. grep rc=1 = no-match
          # (handled below через -z check), rc>1 = real pipeline error.
          set +e
          RESPONSE=$(printf '%s\n' "$REQUEST" | "$BINARY" 2>err.log | grep -m1 '"pong"')
          GREP_RC=$?
          set -e
          if [ "$GREP_RC" -gt 1 ]; then
            echo "Sidecar smoke pipeline error (grep rc=$GREP_RC). stderr:"
            cat err.log
            exit 1
          fi
          if [ -z "$RESPONSE" ]; then
            echo "Sidecar smoke test FAILED — no pong response. stderr:"
            cat err.log
            exit 1
          fi
          echo "Sidecar smoke OK: $RESPONSE"

      - name: Rename binary с Tauri target suffix
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cp dist/${{ matrix.binary_name }} src-tauri/binaries/aurora-sidecar-${{ matrix.target }}.exe
          else
            cp dist/${{ matrix.binary_name }} src-tauri/binaries/aurora-sidecar-${{ matrix.target }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-sidecar-${{ matrix.target }}
          path: src-tauri/binaries/aurora-sidecar-${{ matrix.target }}*
          retention-days: 30
