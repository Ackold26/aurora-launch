name: CI

# Mini-audit fix HIGH-1: explicit permissions:read at workflow level + per-job.
# Block 0 baseline (lint + corpus reproducibility) preserved.
#
# Scope split (POST_PILOT_BACKLOG M1-WORKFLOW-7 close 2026-05-10):
#   - ci.yml (этот файл) owns ALL Python work: lint (ruff + mypy) +
#     pytest matrix Python 3.11/3.12 × OS с coverage + BC corpus +
#     reproducibility checks.
#   - test.yml owns non-Python integrations: Rust + Frontend + Cloud.
#
# Phase 1 DevOps additions (2026-05-15):
#   - pre-commit job: runs all hooks against changed files on PR + all files on push main
#   - Codecov upload in test job (ubuntu-latest / py3.11 matrix leg)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install deps (including pre-commit)
        run: uv pip install --system pre-commit ruff mypy pydantic numpy

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install deps
        run: uv pip install --system -e ".[]" --no-deps && uv pip install --system pydantic numpy pandas rfc8785 click rich ruff mypy pyyaml

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

      - name: mypy
        run: mypy src
        continue-on-error: true  # Phase B+ — strict typing rollout

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        # CI runners don't have aurora-platform-core sibling checkout.
        # Tests that require Phase A integration auto-skip via path checks.
        run: uv pip install --system -e ".[]" --no-deps && uv pip install --system pydantic numpy pandas rfc8785 click rich pytest pytest-cov hypothesis ruff mypy pyyaml

      - name: Run tests
        run: pytest -v --cov=src/aurora_launch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  corpus-check:
    name: BC corpus & reproducibility
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e ".[]" --no-deps && uv pip install --system pydantic numpy pandas rfc8785 click rich pytest

      - name: BC corpus generation
        run: |
          python -c "
          import tempfile, os, subprocess, sys
          d = tempfile.mkdtemp()
          subprocess.check_call([sys.executable, '-m', 'aurora_launch.tools.corpus_cli', 'generate-all', '--output-dir', d])
          n = len([f for f in os.listdir(d) if f.endswith('.aurora.json')])
          assert n == 5, f'Expected 5 projects got {n}'
          print(f'BC corpus: {n} projects OK')
          "

      - name: Reproducibility check
        run: |
          python -c "
          import tempfile, os, json, subprocess, sys
          d = tempfile.mkdtemp()
          p = os.path.join(d, 'test.aurora.json')
          subprocess.check_call([sys.executable, '-m', 'aurora_launch.tools.corpus_cli', 'generate', 'FMCG_food.snacks_savoury', 'baseline', '--seed', '42', '--output', p])
          h = json.load(open(p))['manifest_sha256']
          r = subprocess.run([sys.executable, '-m', 'aurora_launch.tools.reproduce', p, h])
          sys.exit(r.returncode)
          "

