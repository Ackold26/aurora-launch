name: CI

# Mini-audit fix HIGH-1: explicit permissions:read at workflow level + per-job.
# Block 0 baseline (lint + corpus reproducibility) preserved.
#
# Scope split (POST_PILOT_BACKLOG M1-WORKFLOW-7 close 2026-05-10):
#   - ci.yml (этот файл) owns ALL Python work: lint (ruff + mypy) +
#     pytest matrix Python 3.11/3.12 × OS с coverage + BC corpus +
#     reproducibility checks.
#   - test.yml owns non-Python integrations: Rust + Frontend + Cloud.
#
# Phase 1 DevOps additions (2026-05-15):
#   - pre-commit job: runs all hooks against changed files on PR + all files on push main
#   - Codecov upload in test job (ubuntu-latest / py3.11 matrix leg)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Workflow-level: forces bash shell на всех ОС. Windows runner default shell
    # — pwsh (где ${VAR} не expand env vars без $env: prefix); bash-isms в clone
    # steps `${PAT}` + venv setup `$PWD`/`$GITHUB_ENV` требуют bash везде.
    shell: bash

jobs:
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Setup uv venv (avoids /usr/local perms issue для editable installs)
        # `uv pip install --system` targets system Python 3.12 (pre-installed на
        # ubuntu-22.04 runner image) at /usr/local/lib — read-only для runner user.
        # Дedicated venv в $PWD/.venv writable + targets uv-managed Python 3.11.
        run: |
          uv venv --python 3.11 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          # venv layout: bin/ on Linux/macOS, Scripts/ on Windows.
          if [ -d ".venv/Scripts" ]; then
            echo "$PWD/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "$PWD/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Clone aurora-platform-core (sibling for [tool.uv.sources])
        env:
          PAT: ${{ secrets.AURORA_CROSS_REPO_PAT }}
        run: git clone --depth=1 "https://x-access-token:${PAT}@github.com/Ackold26/aurora-platform-core.git" ../aurora-platform-core

      - name: Install sibling packages (editable, --no-deps)
        run: |
          uv pip install -e ../aurora-platform-core/aurora_engines --no-deps
          uv pip install -e ../aurora-platform-core/aurora_observability --no-deps

      - name: Install deps (including pre-commit)
        run: uv pip install pre-commit ruff mypy pydantic numpy

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true  # Sprint Buffer carry-forward — defer codebase-wide auto-fix pass

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Setup uv venv (avoids /usr/local perms issue для editable installs)
        # `uv pip install --system` targets system Python 3.12 (pre-installed на
        # ubuntu-22.04 runner image) at /usr/local/lib — read-only для runner user.
        # Дedicated venv в $PWD/.venv writable + targets uv-managed Python 3.11.
        run: |
          uv venv --python 3.11 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          # venv layout: bin/ on Linux/macOS, Scripts/ on Windows.
          if [ -d ".venv/Scripts" ]; then
            echo "$PWD/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "$PWD/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Clone aurora-platform-core (sibling for [tool.uv.sources])
        env:
          PAT: ${{ secrets.AURORA_CROSS_REPO_PAT }}
        run: git clone --depth=1 "https://x-access-token:${PAT}@github.com/Ackold26/aurora-platform-core.git" ../aurora-platform-core

      - name: Install sibling packages (editable, --no-deps)
        run: |
          uv pip install -e ../aurora-platform-core/aurora_engines --no-deps
          uv pip install -e ../aurora-platform-core/aurora_observability --no-deps

      - name: Install deps
        # Sibling aurora-engines + aurora-observability installed editable в prior step;
        # main `uv pip install -e .` resolves остальные main deps (msgpack, pymc, openpyxl,
        # cryptography, arviz, pytensor, psutil) с PyPI. Dev tools whitelist отдельно
        # ([tool.uv] dev-dependencies — не auto-installed via `uv pip install`).
        run: uv pip install -e ".[]" && uv pip install ruff mypy pyyaml

      - name: ruff check
        run: ruff check src tests
        continue-on-error: true  # Sprint Buffer carry-forward — 710 pre-existing lint errors

      - name: ruff format --check
        run: ruff format --check src tests
        continue-on-error: true  # Sprint Buffer carry-forward — defer cleanup pass

      - name: mypy
        run: mypy src
        continue-on-error: true  # Phase B+ — strict typing rollout

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Setup uv venv (avoids /usr/local perms issue для editable installs)
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          # venv layout: bin/ on Linux/macOS, Scripts/ on Windows.
          if [ -d ".venv/Scripts" ]; then
            echo "$PWD/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "$PWD/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Clone aurora-platform-core (sibling for [tool.uv.sources])
        env:
          PAT: ${{ secrets.AURORA_CROSS_REPO_PAT }}
        run: git clone --depth=1 "https://x-access-token:${PAT}@github.com/Ackold26/aurora-platform-core.git" ../aurora-platform-core

      - name: Install sibling packages (editable, --no-deps)
        run: |
          uv pip install -e ../aurora-platform-core/aurora_engines --no-deps
          uv pip install -e ../aurora-platform-core/aurora_observability --no-deps

      - name: Install dependencies
        # Sibling aurora-engines + aurora-observability installed editable в prior step;
        # main install resolves остальные main deps (msgpack, pymc, openpyxl,
        # cryptography, arviz, pytensor, psutil) с PyPI. Dev tools whitelist отдельно.
        run: uv pip install -e ".[]" && uv pip install pytest pytest-cov hypothesis ruff mypy pyyaml

      - name: Run tests
        env:
          # PEP 540 UTF-8 mode — fixes Windows `cp1252` default encoding errors
          # when reading non-ASCII YAML/JSON files (e.g. test_c3_workflow_integration).
          # No-op on Linux/macOS (UTF-8 default).
          PYTHONUTF8: "1"
        run: pytest -v --cov=src/aurora_launch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false

  corpus-check:
    name: BC corpus & reproducibility
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Setup uv venv (avoids /usr/local perms issue для editable installs)
        # `uv pip install --system` targets system Python 3.12 (pre-installed на
        # ubuntu-22.04 runner image) at /usr/local/lib — read-only для runner user.
        # Дedicated venv в $PWD/.venv writable + targets uv-managed Python 3.11.
        run: |
          uv venv --python 3.11 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          # venv layout: bin/ on Linux/macOS, Scripts/ on Windows.
          if [ -d ".venv/Scripts" ]; then
            echo "$PWD/.venv/Scripts" >> $GITHUB_PATH
          else
            echo "$PWD/.venv/bin" >> $GITHUB_PATH
          fi

      - name: Clone aurora-platform-core (sibling for [tool.uv.sources])
        env:
          PAT: ${{ secrets.AURORA_CROSS_REPO_PAT }}
        run: git clone --depth=1 "https://x-access-token:${PAT}@github.com/Ackold26/aurora-platform-core.git" ../aurora-platform-core

      - name: Install sibling packages (editable, --no-deps)
        run: |
          uv pip install -e ../aurora-platform-core/aurora_engines --no-deps
          uv pip install -e ../aurora-platform-core/aurora_observability --no-deps

      - name: Install dependencies
        # Full main deps resolution (msgpack, pymc, etc.); sibling editable satisfies aurora-engines/observability.
        run: uv pip install -e ".[]" && uv pip install pytest

      - name: BC corpus generation
        run: |
          python -c "
          import tempfile, os, subprocess, sys
          d = tempfile.mkdtemp()
          subprocess.check_call([sys.executable, '-m', 'aurora_launch.tools.corpus_cli', 'generate-all', '--output-dir', d])
          n = len([f for f in os.listdir(d) if f.endswith('.aurora.json')])
          assert n == 5, f'Expected 5 projects got {n}'
          print(f'BC corpus: {n} projects OK')
          "

      - name: Reproducibility check
        run: |
          python -c "
          import tempfile, os, json, subprocess, sys
          d = tempfile.mkdtemp()
          p = os.path.join(d, 'test.aurora.json')
          subprocess.check_call([sys.executable, '-m', 'aurora_launch.tools.corpus_cli', 'generate', 'FMCG_food.snacks_savoury', 'baseline', '--seed', '42', '--output', p])
          h = json.load(open(p))['manifest_sha256']
          r = subprocess.run([sys.executable, '-m', 'aurora_launch.tools.reproduce', p, h])
          sys.exit(r.returncode)
          "

