name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (skip path deps for CI)
        # CI runners don't have aurora-platform-core sibling checkout.
        # Use minimal dependency install (production deps only, no local path overrides).
        # Tests that require Phase A integration auto-skip via path checks.
        run: uv pip install --system -e ".[]" --no-deps && uv pip install --system pydantic numpy pandas rfc8785 click rich pytest pytest-cov hypothesis ruff mypy pyyaml

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src
        continue-on-error: true  # Phase B+ — strict typing rollout

      - name: Run tests
        run: pytest -v --cov=src/aurora_launch --cov-report=term-missing

      - name: BC test corpus generation
        # Cross-platform path via Python tempfile, не /tmp hardcoded
        run: |
          python -c "import tempfile, os, subprocess, sys; d=tempfile.mkdtemp(); subprocess.check_call([sys.executable,'-m','aurora_launch.tools.corpus_cli','generate-all','--output-dir',d]); n=len([f for f in os.listdir(d) if f.endswith('.aurora.json')]); assert n==5, f'Expected 5 projects got {n}'"

      - name: Reproducibility check
        run: |
          python -c "import tempfile, os, json, subprocess, sys; d=tempfile.mkdtemp(); p=os.path.join(d,'test.aurora.json'); subprocess.check_call([sys.executable,'-m','aurora_launch.tools.corpus_cli','generate','FMCG_food.snacks_savoury','baseline','--seed','42','--output',p]); h=json.load(open(p))['manifest_sha256']; r=subprocess.run([sys.executable,'-m','aurora_launch.tools.reproduce',p,h]); sys.exit(r.returncode)"
