# Aurora Launch release pipeline — Final F1.
#
# Triggered by tag push (v0.1.0-rc2, v0.1.0, etc.). Produces signed installers
# + updater manifest + publishes к Vercel endpoint.
#
# Mini-audit findings applied:
# - HIGH-1: permissions scoped per-job (default contents:read, write only
#   для publish job). Build jobs run untrusted code от tagged commit с
#   minimum token scope.
# - HIGH-2: community third-party actions SHA-pinned (dtolnay/rust-toolchain,
#   softprops/action-gh-release, astral-sh/setup-uv). First-party actions/*
#   keep major-tag pins (lower hijack risk + auto patch).
# - HIGH-3: explicit Vercel redeploy после env update — without redeploy
#   Edge Functions serve cached old manifest until cold-start cycling
#   (5-10 минут unpredictable).
#
# Required GitHub Secrets:
# - AURORA_UPDATER_PUBKEY (64-char Ed25519 hex public key) — Block 3 BLOCKER-3
# - AURORA_UPDATER_PRIVATE_KEY (Tauri updater Ed25519 private key)
# - AURORA_UPDATER_KEY_PASSWORD (private key passphrase)
# - VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0-rc2)'
        required: true

# HIGH-1 fix: default к contents:read; only publish job overrides к write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      is_prerelease: ${{ steps.extract.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version info
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if echo "$VERSION" | grep -qE '(alpha|beta|rc|b[0-9])'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify pyproject.toml version matches tag
        run: |
          PYPROJECT_VER=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          TAG_VER="${GITHUB_REF#refs/tags/v}"
          if [ "$PYPROJECT_VER" != "$TAG_VER" ]; then
            echo "ERROR: pyproject.toml version '$PYPROJECT_VER' != tag '$TAG_VER'"
            exit 1
          fi

  test-release:
    name: Full test suite (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python-version: ['3.11', '3.12']
        # A-4 fix: pyproject.toml requires-python = ">=3.11,<3.13".
        # Release must verify BOTH supported versions, not only 3.12.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v --cov=src/aurora_launch --cov-report=term-missing

  build-sidecar:
    name: Build sidecar — ${{ matrix.target }}
    needs: [validate, test-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # A-2 fix (DRY alignment): mirrored full install sequence from
      # sidecar-build.yml to ensure parity. Previously missing the dev-dep
      # uninstall step, risking pytest/hypothesis/ruff bundling into production
      # binary. Now: install runtime only → uninstall dev tooling → PyInstaller.
      - name: Install runtime deps
        run: |
          pip install --upgrade pip
          pip install -e .
      - name: Uninstall dev tooling before PyInstaller (HIGH-4 parity)
        # Prevents dev packages from being bundled into production binary.
        # Belt-and-suspenders alongside spec excludes[] in aurora-sidecar.spec.
        shell: bash
        run: |
          pip uninstall -y pytest pytest-cov hypothesis ruff mypy || true
          pip install "pyinstaller>=6.0"
      - name: Build sidecar binary
        run: pyinstaller packaging/aurora-sidecar.spec --distpath dist --clean
      # A-1 fix: smoke test — mirrors sidecar-build.yml lines 98-133.
      # Validates the production binary before upload. A broken binary that
      # passes pyinstaller but fails at runtime would otherwise reach GitHub
      # Release silently.
      - name: Smoke test built binary (release gate)
        shell: bash
        env:
          AURORA_SIDECAR_AUTH_TOKEN: '${{ secrets.SIDECAR_SMOKE_TOKEN }}'
        run: |
          set -euo pipefail
          if [ -z "${AURORA_SIDECAR_AUTH_TOKEN:-}" ]; then
            AURORA_SIDECAR_AUTH_TOKEN="$(python -c 'import secrets; print(secrets.token_hex(32))')"
            export AURORA_SIDECAR_AUTH_TOKEN
          fi
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            BINARY="dist/aurora-sidecar.exe"
          else
            BINARY="./dist/aurora-sidecar"
          fi
          REQUEST="{\"id\":1,\"method\":\"ping\",\"params\":{},\"auth\":\"$AURORA_SIDECAR_AUTH_TOKEN\"}"
          set +e
          RESPONSE=$(printf '%s\n' "$REQUEST" | "$BINARY" 2>err.log | grep -m1 '"pong"')
          GREP_RC=$?
          set -e
          if [ "$GREP_RC" -gt 1 ]; then
            echo "Sidecar smoke pipeline error (grep rc=$GREP_RC). stderr:"
            cat err.log
            exit 1
          fi
          if [ -z "$RESPONSE" ]; then
            echo "Sidecar smoke FAILED — no pong. stderr:"
            cat err.log
            exit 1
          fi
          echo "Sidecar smoke OK: $RESPONSE"
      - name: Rename binary
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cp dist/aurora-sidecar.exe src-tauri/binaries/aurora-sidecar-${{ matrix.target }}.exe
          else
            cp dist/aurora-sidecar src-tauri/binaries/aurora-sidecar-${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: aurora-sidecar-${{ matrix.target }}
          path: src-tauri/binaries/aurora-sidecar-${{ matrix.target }}*

  build-app:
    name: Build app — ${{ matrix.target }}
    needs: [validate, build-sidecar]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Download sidecar
        uses: actions/download-artifact@v4
        with:
          name: aurora-sidecar-${{ matrix.target }}
          path: src-tauri/binaries/
      # HIGH-2 fix: SHA-pin community-maintained Rust toolchain action.
      # `dtolnay/rust-toolchain@stable` last verified SHA below; rotate
      # quarterly via dependabot or manual review.
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # stable @ 2024-09-01
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Tauri prereqs (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run gen:tokens
      # Audit B-1 (Stage 2 / 2.10): substitute updater pubkey placeholder
      # с реальным AURORA_UPDATER_PUBKEY secret. Без этого шага в production
      # tauri-plugin-updater видит "EMBED_AT_RELEASE_TIME" как pubkey и либо
      # падает при verify, либо принимает любую подпись (CRITICAL bug).
      - name: Substitute updater pubkey в tauri.conf.json
        env:
          AURORA_UPDATER_PUBKEY: ${{ secrets.AURORA_UPDATER_PUBKEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AURORA_UPDATER_PUBKEY:-}" ]; then
            echo "ERROR: AURORA_UPDATER_PUBKEY secret не установлен. Авто-обновление будет нерабочим. Установите secret в GitHub Settings → Secrets."
            exit 1
          fi
          CONF="src-tauri/tauri.conf.json"
          if ! grep -q 'EMBED_AT_RELEASE_TIME' "$CONF"; then
            echo "ERROR: placeholder EMBED_AT_RELEASE_TIME не найден в $CONF — конфигурация уже изменена?"
            exit 1
          fi
          # Используем python вместо sed чтобы корректно работать с JSON
          # escape-sequences (Ed25519 ключ не имеет, но правильный путь).
          python3 -c "
          import json, sys, os
          with open('$CONF', 'r') as f:
              conf = json.load(f)
          pubkey = os.environ['AURORA_UPDATER_PUBKEY']
          conf['plugins']['updater']['pubkey'] = pubkey
          with open('$CONF', 'w') as f:
              json.dump(conf, f, indent=2)
          print('OK: updater pubkey substituted (', len(pubkey), 'bytes)')
          "
      - name: macOS — ad-hoc codesign (no Apple Developer account)
        # Ad-hoc signing allows the DMG to open on the build machine without
        # Gatekeeper prompt for internal/pilot distribution. For public
        # distribution, replace with APPLE_CERTIFICATE + notarytool.
        # "--deep" signs all embedded helpers including the sidecar binary.
        #
        # A-3 fix: removed `|| true`. Codesign failures now fail the step.
        # If the sidecar binary is missing or corrupt, we WANT the build to
        # fail here rather than produce an unsigned/broken DMG.
        # FUTURE: replace `- ` (ad-hoc) with $APPLE_CERTIFICATE when Aurora
        # obtains Apple Developer Program membership.
        if: startsWith(matrix.os, 'macos')
        run: |
          SIDECAR="src-tauri/binaries/aurora-sidecar-${{ matrix.target }}"
          if [ ! -f "$SIDECAR" ]; then
            echo "ERROR: sidecar binary not found at $SIDECAR"
            exit 1
          fi
          codesign --force --deep --sign - "$SIDECAR"
          echo "codesign OK: $(codesign -dv --verbose=4 "$SIDECAR" 2>&1 | head -3)"

      - name: Build Tauri app (production)
        working-directory: frontend
        env:
          AURORA_BUILD_PROFILE: production
          AURORA_UPDATER_PUBKEY: ${{ secrets.AURORA_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.AURORA_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.AURORA_UPDATER_KEY_PASSWORD }}
          # macOS: target flag required for Apple Silicon cross-build.
          # For aarch64-apple-darwin runner, tauri build auto-detects;
          # explicit flag guards against runner misconfiguration.
          TAURI_TARGET: ${{ matrix.target }}
        run: npm run tauri:build
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-artifacts
          find src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.sig" \) -exec cp {} release-artifacts/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: aurora-launch-${{ matrix.target }}
          path: release-artifacts/

  publish:
    name: Publish — Vercel + GitHub Release
    needs: [validate, build-app]
    runs-on: ubuntu-22.04
    # HIGH-1 fix: write permission ONLY here (для GitHub Release create).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
      - name: Compose updater manifest
        id: manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, json, glob
          version = os.environ['VERSION']
          # Audit H-2 (этап 1.7): Tauri на Windows производит .exe (NSIS)
          # И .msi одновременно — оба с .sig. Tauri updater поддерживает
          # ТОЛЬКО NSIS (.exe). Если glob возвращает .msi первым, ключ
          # windows-x86_64 указывает на MSI → авто-апдейтер ломается.
          # Фикс: явный приоритет .exe (NSIS) над .msi, sorted iteration.
          # L-2: используем datetime вместо os.popen('date').
          import datetime
          platforms = {}
          # sorted даёт детерминированный порядок, плюс sort key даёт
          # .exe приоритет (он лексически раньше .msi).
          sigs = sorted(glob.glob('release-artifacts/**/*.sig', recursive=True))
          for sig_path in sigs:
              installer = sig_path.removesuffix('.sig')
              if not os.path.exists(installer):
                  continue
              with open(sig_path) as f:
                  sig = f.read().strip()
              fname = os.path.basename(installer)
              if fname.endswith('.exe'):
                  key = 'windows-x86_64'  # NSIS — Tauri updater format
              elif fname.endswith('.msi'):
                  # MSI не поддерживается Tauri updater; если .exe уже найден
                  # под этим ключом — не перезаписываем; иначе fallback.
                  if 'windows-x86_64' in platforms:
                      continue
                  key = 'windows-x86_64'
              elif fname.endswith('.dmg'):
                  key = 'darwin-aarch64' if 'aarch64' in installer else 'darwin-x86_64'
              elif fname.endswith(('.AppImage', '.deb')):
                  key = 'linux-x86_64'
              else:
                  continue
              platforms[key] = {
                  'signature': sig,
                  'url': f'https://github.com/Ackold26/aurora-launch/releases/download/v{version}/{fname}'
              }
          manifest = {
              'version': version,
              'notes': f'Aurora Launch v{version}',
              'pub_date': datetime.datetime.now(datetime.UTC).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }
          with open('updater-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          PY

      # HIGH-5/HIGH-6 fix: env-var update through individual curl calls
      # с explicit failure check. Previously bash `for KV в "K:V"` splitting
      # на ":" was brittle vs JSON values. Now each var passed via Python
      # JSON-encoded payload и failures fail the step.
      - name: Push updater manifest к Vercel project env vars
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - <<PY
          import json, os, urllib.request, urllib.error

          token = os.environ['VERCEL_TOKEN']
          project = os.environ['VERCEL_PROJECT_ID']
          version = os.environ['VERSION']
          pub_date = os.environ.get('PUB_DATE', '')
          with open('updater-manifest.json') as f:
              manifest = json.load(f)
          platforms_json = json.dumps(manifest['platforms'])

          updates = {
              'AURORA_LATEST_VERSION': version,
              'AURORA_LATEST_PUB_DATE': pub_date,
              'AURORA_LATEST_PLATFORMS_JSON': platforms_json,
          }
          for key, value in updates.items():
              data = json.dumps({
                  'key': key,
                  'value': value,
                  'target': ['production'],
                  'type': 'plain',
              }).encode()
              req = urllib.request.Request(
                  f'https://api.vercel.com/v10/projects/{project}/env',
                  data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              try:
                  urllib.request.urlopen(req, timeout=30).read()
                  print(f'  set {key}')
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace')
                  if e.code == 400 and 'already exists' in body.lower():
                      # Update existing — PATCH /v10/projects/{id}/env/{envId}
                      list_req = urllib.request.Request(
                          f'https://api.vercel.com/v9/projects/{project}/env',
                          headers={'Authorization': f'Bearer {token}'},
                      )
                      env_list = json.loads(urllib.request.urlopen(list_req).read())
                      target_env = next(
                          (e for e in env_list.get('envs', []) if e['key'] == key and 'production' in e.get('target', [])),
                          None,
                      )
                      if target_env is None:
                          raise SystemExit(f'cannot find existing env {key} to update')
                      env_id = target_env['id']
                      patch_req = urllib.request.Request(
                          f'https://api.vercel.com/v9/projects/{project}/env/{env_id}',
                          data=json.dumps({'value': value, 'target': ['production']}).encode(),
                          headers={
                              'Authorization': f'Bearer {token}',
                              'Content-Type': 'application/json',
                          },
                          method='PATCH',
                      )
                      urllib.request.urlopen(patch_req, timeout=30).read()
                      print(f'  updated {key}')
                  else:
                      raise SystemExit(f'env update failed для {key}: {e.code} {body[:200]}')
          PY

      # HIGH-3 fix: explicit Vercel redeploy после env update. Without this,
      # Edge Functions continue serving cached env values for 5-10 минут
      # (cold start cycling). Forced redeploy ensures atomic swap.
      - name: Trigger Vercel production redeploy
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Trigger latest production deployment promotion. Vercel Deploy Hooks
          # API: POST /v6/deployments. Если project linked к git, redeploy
          # latest commit на default branch.
          python3 - <<PY
          import json, os, urllib.request, urllib.error

          token = os.environ['VERCEL_TOKEN']
          project = os.environ['VERCEL_PROJECT_ID']
          # First fetch latest production deployment
          req = urllib.request.Request(
              f'https://api.vercel.com/v6/deployments?projectId={project}&target=production&limit=1',
              headers={'Authorization': f'Bearer {token}'},
          )
          deployments = json.loads(urllib.request.urlopen(req, timeout=30).read())
          deps = deployments.get('deployments', [])
          if not deps:
              print('  no prior production deployment to redeploy from — skipping')
          else:
              deploy_id = deps[0]['uid']
              # Promote/redeploy
              redeploy_req = urllib.request.Request(
                  f'https://api.vercel.com/v13/deployments?forceNew=1',
                  data=json.dumps({
                      'name': deps[0]['name'],
                      'deploymentId': deploy_id,
                      'target': 'production',
                  }).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  },
                  method='POST',
              )
              try:
                  resp = urllib.request.urlopen(redeploy_req, timeout=30).read()
                  print('  redeploy triggered:', json.loads(resp).get('id'))
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8', errors='replace')
                  print(f'  redeploy attempt failed: {e.code} {body[:200]}')
                  # Не fail step — env vars updated successfully; redeploy is
                  # optional acceleration. Edge functions cycle within 10 минут.
          PY

      # HIGH-2 fix: SHA-pin community-maintained release action.
      # softprops/action-gh-release@v2 last verified SHA below.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: Aurora Launch v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.sig
            updater-manifest.json
